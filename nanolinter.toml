# The lint plan of the pull request gate: Forge CI runs `nanolinter verify`
# against it. The checks are the ones `just lint-all` runs, with the SAST
# and dependency scans the pull request gate ran before.
# `nanolinter explain --all` lists more checks.

[detect]
auto = true

[verify]
checks = [
  "version-control",
  "commits",
  "secrets",
  "sast",
  "osv",
  "yaml",
  "markdown",
  "shell",
  "shell-format",
  "actions",
  "license",
  "xml",
  "container",
  "java-checkstyle",
  "java-pmd",
  "java-spotbugs",
  "java-format",
]

[policy]
block = [
  "version-control",
  "commits",
  "secrets",
  "sast",
  "osv",
  "yaml",
  "markdown",
  "shell",
  "shell-format",
  "actions",
  "license",
  "xml",
  "container",
  "java-checkstyle",
  "java-pmd",
  "java-spotbugs",
  "java-format",
]

# Two choices, not defects in the code, so these rules are left out:
# - renovate.json takes its minimum release age from the organisation's
#   base configuration and shortens it for two packages, with the reason
#   in each rule; the rule asks for seven days in this file.
# - docker-compose.yml only starts the database for local development; the
#   rules ask for a read-only, no-new-privileges service.
[linters.sast.settings]
"opengrep.exclude_rules" = [
  "package_managers.renovate.renovate-missing-minimum-release-age.renovate-missing-minimum-release-age",
  "yaml.docker-compose.security.no-new-privileges.no-new-privileges",
  "yaml.docker-compose.security.writable-filesystem-service.writable-filesystem-service",
]
